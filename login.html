<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIE MASTER - Iniciar Sesión</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="shortcut icon" href="/favicon.png?v=2" type="image/png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/paci.css">
  <link rel="stylesheet" href="/tailwind-utils.css">
  <!-- Google Identity Services (GIS) - Sign in with Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    
    /* Fondo animado: 5 blobs de gradiente radial que flotan en loop */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 18% 25%, rgba(56, 189, 248, 0.32)  0%, transparent 38%),
            radial-gradient(circle at 78% 22%, rgba(168, 139, 250, 0.28) 0%, transparent 42%),
            radial-gradient(circle at 52% 78%, rgba(244, 114, 182, 0.24) 0%, transparent 40%),
            radial-gradient(circle at 88% 88%, rgba(52, 211, 153, 0.22)  0%, transparent 38%),
            radial-gradient(circle at 8% 92%,  rgba(251, 146, 60, 0.22)  0%, transparent 38%);
        background-size: 220% 220%;
        background-attachment: fixed;
        z-index: -2;
        pointer-events: none;
        animation: bg-flow 28s ease-in-out infinite alternate;
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url('/assets/canva/bg-pattern.png');
        background-size: cover;
        background-position: center;
        opacity: 0.08;
        z-index: -1;
        pointer-events: none;
        mix-blend-mode: overlay;
    }
    @keyframes bg-flow {
        0%   { background-position: 0% 0%,   100% 0%,   50% 100%, 100% 100%, 0% 100%; }
        25%  { background-position: 20% 15%, 80% 20%,   45% 90%,  90% 95%,   5% 95%; }
        50%  { background-position: 100% 50%, 0% 50%,   100% 50%, 50% 0%,    50% 100%; }
        75%  { background-position: 80% 85%, 15% 80%,   25% 10%,  10% 5%,    95% 5%; }
        100% { background-position: 100% 100%, 0% 100%, 50% 0%,   0% 0%,     100% 0%; }
    }
    [data-theme="light"] body::before {
        background:
            radial-gradient(circle at 18% 25%, rgba(125, 211, 252, 0.55) 0%, transparent 38%),
            radial-gradient(circle at 78% 22%, rgba(196, 181, 253, 0.5)  0%, transparent 42%),
            radial-gradient(circle at 52% 78%, rgba(251, 207, 232, 0.5)  0%, transparent 40%),
            radial-gradient(circle at 88% 88%, rgba(167, 243, 208, 0.45) 0%, transparent 38%),
            radial-gradient(circle at 8% 92%,  rgba(254, 215, 170, 0.5)  0%, transparent 38%);
        background-size: 220% 220%;
        background-attachment: fixed;
    }
    [data-theme="light"] body::after { opacity: 0.05; mix-blend-mode: multiply; filter: invert(1) hue-rotate(180deg); }

    .brand-logo-login {
        display: block;
        width: 128px;
        height: 128px;
        margin: 0 auto 1rem;
        border-radius: 1.5rem;
        box-shadow: 0 14px 38px rgba(18, 64, 196, 0.5);
        animation: floatLogo 4s ease-in-out infinite;
    }
    @keyframes floatLogo {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-6px) rotate(-2deg); }
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 2rem;
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      animation: fadeInUp 0.8s var(--ease-out-expo);
    }
    
    .card-header {
      padding: 2.5rem 2rem 2rem;
      text-align: center;
    }
    .card-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }
    .card-header .subtitle {
      font-size: 0.7rem;
      color: var(--glow-primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-top: 0.75rem;
      opacity: 0.8;
    }
    .card-header .desc {
      font-size: 0.8rem;
      color: rgba(226, 232, 240, 0.78);
      font-weight: 500;
      margin-top: 0.65rem;
      line-height: 1.45;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    [data-theme="light"] .card-header .desc { color: #334155; }
    [data-theme="light"] .card-header .subtitle { color: #1e40af; opacity: 1; }
    [data-theme="light"] .field label { color: #334155; }
    [data-theme="light"] .field input { background: #ffffff; color: #0f172a; border-color: #cbd5e1; }
    [data-theme="light"] .field input::placeholder { color: #94a3b8; }
    [data-theme="light"] .divider { color: #475569; }
    [data-theme="light"] .divider::before, [data-theme="light"] .divider::after { background: rgba(15,23,42,0.12); }

    .tabs {
      display: flex;
      background: rgba(2, 6, 23, 0.4);
      padding: 0.5rem;
      margin: 0 1.5rem;
      border-radius: 1rem;
      gap: 0.25rem;
    }
    .tab {
      flex: 1; padding: 0.75rem; text-align: center; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; cursor: pointer; color: #94a3b8; border-radius: 0.75rem;
      transition: all 0.3s var(--ease-out-expo); background: none; border: none;
    }
    .tab.active { color: #020617; background: var(--glow-primary); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

    .form-body { padding: 2rem 2.5rem 2.5rem; }
    .form-section { display: none; animation: fadeInUp 0.4s var(--ease-out-expo); }
    .form-section.active { display: block; }
    
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(56, 189, 248, 0.1);
      border-radius: 0.875rem; padding: 0.875rem 1rem; font-size: 0.9rem; color: #fff; outline: none; transition: all 0.3s;
    }
    .field input:focus { border-color: var(--glow-primary); box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }
    
    .btn-submit {
      width: 100%; padding: 1rem; border-radius: 1rem; border: none;
      background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary));
      color: #020617; font-weight: 800; text-transform: uppercase; cursor: pointer;
      transition: all 0.3s var(--ease-out-expo); box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.6); }

    .divider {
      display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0;
      color: #475569; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
    
    #google-btn-container {
      display: flex; justify-content: center; background: #fff; border-radius: 1rem; padding: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <img class="brand-logo-login" src="/assets/canva/logo.png" alt="PIE MASTER">
      <div class="subtitle" id="tenant-name-sub">Cargando...</div>
      <div class="desc">Plataforma Inteligente de Adecuación Curricular Individual</div>
    </div>

    <div class="tabs" id="auth-tabs">
      <button type="button" class="tab active" onclick="showTab('login')">Entrar</button>
      <button type="button" class="tab" onclick="showTab('register')">Unirse</button>
    </div>

    <div class="form-body">
      <div id="error-msg" style="color:#f87171; background:rgba(248,113,113,0.1); padding:0.75rem; border-radius:0.75rem; font-size:0.8rem; margin-bottom:1rem; display:none;"></div>
      
      <!-- LOGIN -->
      <form id="form-login" class="form-section active" onsubmit="handleLogin(event)">
        <div class="field">
          <label>Correo Electrónico</label>
          <input type="email" id="login-email" required placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" id="btn-login">Iniciar Sesión</button>
        
        <div class="divider">o continúa con</div>
        <div id="google-btn-container">
            <div id="g_id_onload" data-auto_prompt="false"></div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
      </form>

      <!-- REGISTER -->
      <form id="form-register" class="form-section" onsubmit="handleRegister(event)">
        <div class="field">
          <label>Nombre Completo</label>
          <input type="text" id="reg-name" required placeholder="Nombre Apellido">
        </div>
        <div class="field">
          <label>Correo Electrónico</label>
          <input type="email" id="reg-email" required placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="field">
          <label>Establecimiento</label>
          <select id="reg-tenant" required>
            <option value="">Cargando establecimientos...</option>
          </select>
        </div>
        <button type="submit" class="btn-submit" id="btn-register">Crear Cuenta</button>
      </form>
    </div>
  </div>

  <script>
    const errorEl = document.getElementById('error-msg');

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      
      const btn = event.currentTarget;
      btn.classList.add('active');
      document.getElementById('form-' + name).classList.add('active');
      errorEl.style.display = 'none';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.ok) {
          localStorage.setItem('paci_token', data.token);
          localStorage.setItem('paci_user', JSON.stringify({ email: data.email, name: data.name, role: data.role, tenantSlug: data.tenantSlug || '' }));
          window.location.href = '/dashboard.html';
        } else {
          showError(data.error || 'Error al iniciar sesión');
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
        }
      } catch (err) {
        showError('Error de conexión');
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const tenantSlug = document.getElementById('reg-tenant').value;
      const btn = document.getElementById('btn-register');

      if (!tenantSlug) {
        showError('Selecciona tu establecimiento.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, tenantSlug })
        });
        const data = await res.json();
        if (data.ok) {
          localStorage.setItem('paci_token', data.token);
          localStorage.setItem('paci_user', JSON.stringify({ email: data.email, name: data.name, role: data.role, tenantSlug: data.tenantSlug || '' }));
          window.location.href = '/dashboard.html';
        } else {
          showError(data.error || 'Error al crear cuenta');
          btn.disabled = false;
          btn.textContent = 'Crear Cuenta';
        }
      } catch (err) {
        showError('Error de conexión');
        btn.disabled = false;
        btn.textContent = 'Crear Cuenta';
      }
    }

    // Google Sign-In
    async function handleGoogleResponse(response) {
      try {
        const res = await fetch('/api/login-google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (data.ok) {
          localStorage.setItem('paci_token', data.token);
          localStorage.setItem('paci_user', JSON.stringify({ email: data.email, name: data.name, role: data.role, tenantSlug: data.tenantSlug || '' }));
          window.location.href = '/dashboard.html';
        } else {
          showError(data.error || 'Error con Google');
        }
      } catch (err) {
        showError('Error de conexión con Google');
      }
    }

    window.onload = async function () {
      // Configuración del colegio (resuelto por subdominio o el primero activo)
      let tenantActual = '';
      try {
        const cfg = await fetch('/api/tenant-config').then(r => r.json());
        if(cfg.nombre) {
            document.getElementById('tenant-name-sub').textContent = cfg.nombre;
        }
        tenantActual = cfg.id || '';
      } catch(e) {}

      // Poblar el selector de establecimientos del registro.
      try {
        const data = await fetch('/api/tenants').then(r => r.json());
        const sel = document.getElementById('reg-tenant');
        const lista = (data && data.tenants) || [];
        if (sel) {
          if (!lista.length) {
            sel.innerHTML = '<option value="">No hay establecimientos disponibles</option>';
          } else {
            sel.innerHTML = '<option value="">Selecciona tu establecimiento</option>' +
              lista.map(t => '<option value="' + t.slug + '">' + (t.nombre || t.slug) + '</option>').join('');
            // Pre-seleccionar el del subdominio (si lo hay) o, si es el unico, ese.
            if (tenantActual && lista.some(t => t.slug === tenantActual)) {
              sel.value = tenantActual;
            } else if (lista.length === 1) {
              sel.value = lista[0].slug;
            }
          }
        }
      } catch(e) {}

      // Inicializar Google
      try {
        const googleCfg = await fetch('/api/google-config').then(r => r.json());
        if (googleCfg.enabled && googleCfg.client_id) {
          google.accounts.id.initialize({
            client_id: googleCfg.client_id,
            callback: handleGoogleResponse
          });
          google.accounts.id.renderButton(
            document.querySelector('.g_id_signin'),
            { theme: 'outline', size: 'large', width: 340 }
          );
        } else {
          document.getElementById('google-btn-container').style.display = 'none';
          document.querySelector('.divider').style.display = 'none';
        }
      } catch (e) {
        console.error('Google client init failed', e);
      }
    };
  </script>
</body>
</html>
