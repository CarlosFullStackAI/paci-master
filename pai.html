<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAI - Plan de Apoyo Individual</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="shortcut icon" href="/favicon.png?v=2" type="image/png">

  <!-- Auth guard: si no hay sesion, redirigir al login -->
  <script>
  (function () {
    // Gate rapido por indicador no-secreto; la sesion real es la cookie httpOnly.
    if (!localStorage.getItem('paci_user')) { window.location.href = '/login.html'; return; }
    fetch('/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({})
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) {
        localStorage.removeItem('paci_user');
        window.location.href = '/login.html';
      }
    }).catch(function () {});
  })();
  </script>

  <script>
    // Tema dia/noche: fijar el atributo ANTES de pintar (evita parpadeo).
    (function () {
      try {
        var t = localStorage.getItem('paci_theme');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Config del establecimiento (tenant). Mismo patron que app.html. -->
  <script>
  window.TENANT_SLUG = 'lcm-pulebu';
  window.TENANT_CONFIG = null;
  window.TENANT_CONFIG_READY = fetch('/data/tenants/' + window.TENANT_SLUG + '/config.json')
    .then(function (r) { return r.json(); })
    .then(function (cfg) { window.TENANT_CONFIG = cfg; return cfg; })
    .catch(function () { return { nombre: 'Establecimiento' }; });
  </script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #1240c4;
      --azul-oscuro: #091845;
      --gris: #64748b;
      --borde: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .topbar {
      background: var(--azul-oscuro);
      color: #fff;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .topbar h1 { font-size: 1.05rem; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .topbar .sub { font-size: 0.75rem; color: #93c5fd; margin-top: 0.15rem; }
    .topbar-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: transform 0.1s, opacity 0.15s, filter 0.15s, box-shadow 0.15s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .btn-primary { background: var(--azul); color: #fff; }
    .btn-green { background: #059669; color: #fff; }
    .btn-amber { background: #d97706; color: #fff; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.22); filter: none; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-sm { padding: 0.4rem 0.65rem; font-size: 0.72rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .wrap { max-width: 980px; margin: 1.5rem auto; padding: 0 1rem 4rem; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.4);
    }
    .card h2 {
      font-size: 0.95rem;
      margin: 0 0 1rem;
      color: var(--azul-oscuro);
      border-bottom: 2px solid var(--borde);
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grid { display: grid; gap: 0.85rem; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--gris); margin-bottom: 0.25rem; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) { border-color: #cbd5e1; }
    input:focus, select:focus, textarea:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(18,64,196,0.2); }
    textarea { resize: vertical; min-height: 60px; }
    /* Marca de campos obligatorios */
    label .req { color: #dc2626; font-weight: 700; }

    .apoyo {
      border: 1px solid var(--borde);
      border-left: 4px solid var(--azul);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #f8fafc;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .apoyo:hover { box-shadow: 0 2px 10px -4px rgba(0,0,0,0.25); border-left-color: var(--azul-oscuro); }
    .apoyo-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .apoyo-head .titulo { font-weight: 700; font-size: 0.85rem; color: var(--azul-oscuro); }
    .empty {
      text-align: center;
      color: var(--gris);
      padding: 1.75rem 1.5rem;
      border: 2px dashed var(--borde);
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }

    /* Responsividad movil: el topbar pasa a columna y los botones se reparten */
    @media (max-width: 600px) {
      .topbar { flex-direction: column; align-items: stretch; padding: 0.75rem 1rem; }
      .topbar-actions { width: 100%; }
      .topbar-actions .btn { flex: 1; justify-content: center; }
      .wrap { margin-top: 1rem; }
      .card { padding: 1.1rem; }
      .apoyo-head { flex-wrap: wrap; gap: 0.5rem; }
    }

    /* ===== EFECTOS ===== */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .card { animation: fadeInUp 0.45s cubic-bezier(0.16, 0.84, 0.44, 1) both; }
    body { transition: background-color 0.35s ease, color 0.35s ease; }
    #theme-toggle i { transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    #theme-toggle:hover i { transform: rotate(25deg) scale(1.15); }

    /* ===== MODO OSCURO (dia/noche) ===== */
    [data-theme="dark"] body { background: #0b1120; color: #e8eef6; }
    [data-theme="dark"] .card { background: #131c2e; box-shadow: 0 10px 25px -10px rgba(0,0,0,0.6); }
    [data-theme="dark"] .card h2 { color: #bcd4ff; border-bottom-color: #243049; }
    [data-theme="dark"] label { color: #93a4bd; }
    [data-theme="dark"] input,
    [data-theme="dark"] select,
    [data-theme="dark"] textarea { background: #0f1726; border-color: #2a3854; color: #e8eef6; }
    [data-theme="dark"] input:hover:not(:focus),
    [data-theme="dark"] select:hover:not(:focus),
    [data-theme="dark"] textarea:hover:not(:focus) { border-color: #3a4a68; }
    [data-theme="dark"] .apoyo { background: #0f1726; border-color: #243049; }
    [data-theme="dark"] .apoyo:hover { border-left-color: #3b82f6; }
    [data-theme="dark"] .apoyo-head .titulo { color: #bcd4ff; }
    [data-theme="dark"] .empty { border-color: #2a3854; color: #93a4bd; }

    /* Accesibilidad: respetar usuarios que prefieren menos movimiento */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      #theme-toggle:hover i { transform: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1><i class="fa-solid fa-hands-holding-child" aria-hidden="true"></i> Plan de Apoyo Individual (PAI)</h1>
      <div class="sub" id="tenant-name">Cargando establecimiento…</div>
    </div>
    <nav class="topbar-actions" aria-label="Acciones del documento">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver</a>
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-sm" onclick="toggleTheme()" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      <button type="button" class="btn btn-green btn-sm" onclick="descargarPDF()"><i class="fa-solid fa-download" aria-hidden="true"></i> PDF</button>
      <button type="button" class="btn btn-amber btn-sm" onclick="imprimir()"><i class="fa-solid fa-print" aria-hidden="true"></i> Imprimir</button>
      <button type="button" id="btn-guardar" class="btn btn-primary btn-sm" onclick="guardar()"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar</button>
    </nav>
  </header>

  <div class="wrap">
    <!-- Datos del estudiante -->
    <div class="card">
      <h2><i class="fa-solid fa-user-graduate" aria-hidden="true"></i> Datos del estudiante</h2>
      <div class="grid grid-2">
        <div>
          <label for="in-nombre">Nombre completo <span class="req" aria-hidden="true">*</span></label>
          <input id="in-nombre" type="text" placeholder="Nombre del estudiante" autocomplete="off" required aria-required="true">
        </div>
        <div>
          <label for="in-rut">RUT</label>
          <input id="in-rut" type="text" placeholder="12.345.678-9" autocomplete="off" inputmode="text">
        </div>
        <div>
          <label for="in-curso">Curso / Nivel</label>
          <input id="in-curso" type="text" placeholder="Ej: 3° Básico" autocomplete="off">
        </div>
        <div>
          <label for="in-diagnostico">Diagnóstico / NEE</label>
          <input id="in-diagnostico" type="text" placeholder="Ej: TEL Mixto" autocomplete="off">
        </div>
        <div>
          <label for="in-ano">Año escolar</label>
          <input id="in-ano" type="number" value="2026" inputmode="numeric" min="2020" max="2100">
        </div>
        <div>
          <label for="in-periodo">Período del plan</label>
          <select id="in-periodo">
            <option value="Anual" selected>Anual</option>
            <option value="1er Trimestre">1er Trimestre</option>
            <option value="2do Trimestre">2do Trimestre</option>
            <option value="3er Trimestre">3er Trimestre</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Apoyos -->
    <div class="card">
      <h2>
        <i class="fa-solid fa-people-arrows" aria-hidden="true"></i> Apoyos del estudiante
        <button type="button" class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="agregarApoyo()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i> Agregar apoyo
        </button>
      </h2>
      <div id="apoyos-list"></div>
    </div>

    <!-- Equipo de apoyo -->
    <div class="card">
      <h2>
        <i class="fa-solid fa-user-group" aria-hidden="true"></i> Equipo de apoyo (PIE)
        <button type="button" class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="agregarMiembro()">
          <i class="fa-solid fa-plus" aria-hidden="true"></i> Agregar profesional
        </button>
      </h2>
      <div id="equipo-list"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ====== Constantes de dominio (PIE chileno) ======
    const TIPOS_APOYO = [
      'Pedagógico',
      'Psicopedagógico',
      'Fonoaudiológico',
      'Psicológico',
      'Psicosocial / Trabajo Social',
      'Kinésico / Terapia Ocupacional',
      'Otro'
    ];
    const MODALIDADES = ['Dentro del aula', 'Fuera del aula', 'Mixto'];

    // ====== Estado ======
    const state = {
      apoyos: [],
      equipo: [],
      documentId: null,
      studentId: null
    };
    let apoyoSeq = 0;
    let miembroSeq = 0;

    const token = localStorage.getItem('paci_token');
    const params = new URLSearchParams(window.location.search);

    // Permisos por rol (mismo criterio que dashboard.html / app.html).
    // Roles de solo lectura no pueden crear/editar documentos.
    const USER = JSON.parse(localStorage.getItem('paci_user') || '{}');
    const CAN_CREATE = ['admin', 'teacher', 'educador_diferencial'].includes(USER.role || 'teacher');

    const $ = (id) => document.getElementById(id);

    // ===== Tema dia/noche =====
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('paci_theme', next); } catch (e) {}
      syncThemeIcon();
    }
    function syncThemeIcon() {
      const ic = document.querySelector('#theme-toggle i');
      if (ic) ic.className = (document.documentElement.getAttribute('data-theme') === 'dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    // Escapar texto para insertarlo de forma segura en HTML (PDF/impresion).
    const escapeHtml = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function toast(msg, isError) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { t.className = 'toast'; }, 2800);
    }

    // ====== Apoyos ======
    function agregarApoyo(data) {
      const a = data || {};
      state.apoyos.push({
        _id: ++apoyoSeq,
        profesional: a.profesional || '',
        tipoApoyo: a.tipoApoyo || TIPOS_APOYO[0],
        modalidad: a.modalidad || MODALIDADES[0],
        frecuencia: a.frecuencia || '',
        horas: a.horas || '',
        objetivo: a.objetivo || '',
        periodo: a.periodo || ''
      });
      renderApoyos();
    }

    function eliminarApoyo(id) {
      state.apoyos = state.apoyos.filter((a) => a._id !== id);
      renderApoyos();
    }

    function renderApoyos() {
      const cont = $('apoyos-list');
      if (!state.apoyos.length) {
        cont.innerHTML = '<div class="empty">Aún no hay apoyos. Presiona "Agregar apoyo" para comenzar.</div>';
        return;
      }
      cont.innerHTML = state.apoyos.map((a, i) => {
        const tipos = TIPOS_APOYO.map((t) =>
          '<option value="' + escapeHtml(t) + '"' + (t === a.tipoApoyo ? ' selected' : '') + '>' + escapeHtml(t) + '</option>'
        ).join('');
        const modos = MODALIDADES.map((m) =>
          '<option value="' + escapeHtml(m) + '"' + (m === a.modalidad ? ' selected' : '') + '>' + escapeHtml(m) + '</option>'
        ).join('');
        return '' +
          '<div class="apoyo">' +
            '<div class="apoyo-head">' +
              '<span class="titulo">Apoyo ' + (i + 1) + '</span>' +
              '<button class="btn btn-danger btn-sm" aria-label="Eliminar apoyo" onclick="eliminarApoyo(' + a._id + ')"><i class="fa-solid fa-trash"></i></button>' +
            '</div>' +
            '<div class="grid grid-3">' +
              '<div><label>Profesional</label><input type="text" placeholder="Ej: Fonoaudióloga" value="' + escapeHtml(a.profesional) + '" oninput="setApoyo(' + a._id + ',\'profesional\',this.value)"></div>' +
              '<div><label>Tipo de apoyo</label><select onchange="setApoyo(' + a._id + ',\'tipoApoyo\',this.value)">' + tipos + '</select></div>' +
              '<div><label>Modalidad</label><select onchange="setApoyo(' + a._id + ',\'modalidad\',this.value)">' + modos + '</select></div>' +
              '<div><label>Frecuencia</label><input type="text" placeholder="Ej: 2 veces/semana" value="' + escapeHtml(a.frecuencia) + '" oninput="setApoyo(' + a._id + ',\'frecuencia\',this.value)"></div>' +
              '<div><label>Horas semanales</label><input type="text" placeholder="Ej: 3 hrs" value="' + escapeHtml(a.horas) + '" oninput="setApoyo(' + a._id + ',\'horas\',this.value)"></div>' +
              '<div><label>Período</label><input type="text" placeholder="Ej: Marzo a Junio" value="' + escapeHtml(a.periodo) + '" oninput="setApoyo(' + a._id + ',\'periodo\',this.value)"></div>' +
            '</div>' +
            '<div style="margin-top:0.75rem;"><label>Objetivo del apoyo</label><textarea oninput="setApoyo(' + a._id + ',\'objetivo\',this.value)" placeholder="¿Qué se busca lograr con este apoyo?">' + escapeHtml(a.objetivo) + '</textarea></div>' +
          '</div>';
      }).join('');
    }

    function setApoyo(id, campo, valor) {
      const a = state.apoyos.find((x) => x._id === id);
      if (a) a[campo] = valor;
    }

    // ====== Equipo ======
    function agregarMiembro(data) {
      const m = data || {};
      state.equipo.push({ _id: ++miembroSeq, nombre: m.nombre || '', cargo: m.cargo || '' });
      renderEquipo();
    }

    function eliminarMiembro(id) {
      state.equipo = state.equipo.filter((m) => m._id !== id);
      renderEquipo();
    }

    function renderEquipo() {
      const cont = $('equipo-list');
      if (!state.equipo.length) {
        cont.innerHTML = '<div class="empty">Opcional: agrega los profesionales del equipo PIE.</div>';
        return;
      }
      cont.innerHTML = state.equipo.map((m) =>
        '<div class="grid grid-2" style="margin-bottom:0.6rem;align-items:end;">' +
          '<div><label>Nombre</label><input type="text" value="' + escapeHtml(m.nombre) + '" oninput="setMiembro(' + m._id + ',\'nombre\',this.value)"></div>' +
          '<div style="display:flex;gap:0.5rem;align-items:end;">' +
            '<div style="flex:1;"><label>Cargo</label><input type="text" placeholder="Ej: Coordinadora PIE" value="' + escapeHtml(m.cargo) + '" oninput="setMiembro(' + m._id + ',\'cargo\',this.value)"></div>' +
            '<button class="btn btn-danger btn-sm" aria-label="Eliminar profesional" onclick="eliminarMiembro(' + m._id + ')"><i class="fa-solid fa-trash"></i></button>' +
          '</div>' +
        '</div>'
      ).join('');
    }

    function setMiembro(id, campo, valor) {
      const m = state.equipo.find((x) => x._id === id);
      if (m) m[campo] = valor;
    }

    // ====== Recolectar datos del formulario ======
    function recolectar() {
      const student = {
        name: $('in-nombre').value.trim(),
        rut: $('in-rut').value.trim(),
        curso: $('in-curso').value.trim(),
        diagnosis: $('in-diagnostico').value.trim(),
        anoEscolar: $('in-ano').value.trim()
      };
      const apoyos = state.apoyos.map((a) => ({
        profesional: a.profesional,
        tipoApoyo: a.tipoApoyo,
        modalidad: a.modalidad,
        frecuencia: a.frecuencia,
        horas: a.horas,
        objetivo: a.objetivo,
        periodo: a.periodo
      }));
      const team = state.equipo.map((m) => ({ nombre: m.nombre, cargo: m.cargo }));
      return {
        planType: 'pai',
        trimester: $('in-periodo').value,
        student,
        apoyos,
        team
      };
    }

    // ====== Guardar ======
    async function guardar() {
      if (!CAN_CREATE) { toast('Tu rol (' + (USER.role || 'lectura') + ') solo permite lectura.', true); return; }
      const data = recolectar();
      if (!data.student.name) { toast('Falta el nombre del estudiante.', true); return; }
      if (!data.apoyos.length) { toast('Agrega al menos un apoyo antes de guardar.', true); return; }

      try {
        const res = await fetch('/api/documents/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // Si ya existe (cargado o guardado antes), enviamos su id para ACTUALIZAR.
          body: JSON.stringify(Object.assign({ _token: token, documentId: state.documentId || undefined }, data))
        });
        const out = await res.json();
        if (!out.ok) { toast(out.error || 'Error al guardar.', true); return; }
        state.documentId = out.documentId;
        if (out.studentId) state.studentId = out.studentId;
        toast('PAI guardado correctamente.');
      } catch (e) {
        toast('Error de red al guardar.', true);
      }
    }

    // ====== Construir HTML imprimible del PAI ======
    function construirHtmlImpresion() {
      const d = recolectar();
      const cfg = window.TENANT_CONFIG || { nombre: 'Establecimiento' };
      const filas = d.apoyos.map((a, i) =>
        '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + escapeHtml(a.profesional || '-') + '</td>' +
          '<td>' + escapeHtml(a.tipoApoyo || '-') + '</td>' +
          '<td>' + escapeHtml(a.modalidad || '-') + '</td>' +
          '<td>' + escapeHtml(a.frecuencia || '-') + '</td>' +
          '<td>' + escapeHtml(a.horas || '-') + '</td>' +
          '<td>' + escapeHtml(a.periodo || '-') + '</td>' +
          '<td>' + escapeHtml(a.objetivo || '-') + '</td>' +
        '</tr>'
      ).join('');

      const equipoFilas = d.team.length
        ? d.team.map((m) => '<li>' + escapeHtml(m.nombre || '-') + ' — ' + escapeHtml(m.cargo || '-') + '</li>').join('')
        : '<li>—</li>';

      const css =
        'body{font-family:Arial,Helvetica,sans-serif;color:#1e293b;font-size:12px;margin:0;}' +
        '.head{border-bottom:3px solid #091845;padding-bottom:10px;margin-bottom:16px;}' +
        '.head h1{color:#091845;font-size:18px;margin:0 0 4px;}' +
        '.head .sub{color:#1240c4;font-size:13px;font-weight:bold;}' +
        '.meta{font-size:11px;color:#475569;margin-top:4px;}' +
        'table{width:100%;border-collapse:collapse;margin-top:8px;}' +
        'th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:top;font-size:11px;}' +
        'th{background:#091845;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;}' +
        'h3{color:#091845;font-size:13px;margin:18px 0 6px;border-bottom:1px solid #cbd5e1;padding-bottom:3px;}' +
        '.datos td{border:none;padding:3px 4px;}' +
        '.datos .lbl{color:#64748b;font-weight:bold;width:140px;font-size:10px;text-transform:uppercase;}' +
        'ul{margin:6px 0;padding-left:18px;}' +
        '.firmas{margin-top:40px;display:flex;justify-content:space-around;text-align:center;font-size:11px;}' +
        '.firmas div{border-top:1px solid #475569;padding-top:6px;width:40%;}' +
        '@page{size:letter;margin:1.6cm;}';

      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
        '<title>PAI_' + escapeHtml(d.student.name || 'Estudiante') + '</title>' +
        '<style>' + css + '</style></head><body>' +
        '<div class="head">' +
          '<h1>' + escapeHtml(cfg.nombre || 'Establecimiento') + '</h1>' +
          '<div class="sub">Plan de Apoyo Individual (PAI) — Programa de Integración Escolar</div>' +
          '<div class="meta">Año escolar: ' + escapeHtml(d.student.anoEscolar || '') + ' &nbsp;·&nbsp; Período: ' + escapeHtml(d.trimester) + ' &nbsp;·&nbsp; Decreto 170/2009</div>' +
        '</div>' +
        '<h3>Datos del estudiante</h3>' +
        '<table class="datos">' +
          '<tr><td class="lbl">Nombre</td><td>' + escapeHtml(d.student.name || '-') + '</td>' +
              '<td class="lbl">RUT</td><td>' + escapeHtml(d.student.rut || '-') + '</td></tr>' +
          '<tr><td class="lbl">Curso / Nivel</td><td>' + escapeHtml(d.student.curso || '-') + '</td>' +
              '<td class="lbl">Diagnóstico / NEE</td><td>' + escapeHtml(d.student.diagnosis || '-') + '</td></tr>' +
        '</table>' +
        '<h3>Apoyos</h3>' +
        '<table>' +
          '<thead><tr><th>#</th><th>Profesional</th><th>Tipo</th><th>Modalidad</th><th>Frecuencia</th><th>Horas</th><th>Período</th><th>Objetivo</th></tr></thead>' +
          '<tbody>' + (filas || '<tr><td colspan="8">Sin apoyos registrados.</td></tr>') + '</tbody>' +
        '</table>' +
        '<h3>Equipo de apoyo (PIE)</h3>' +
        '<ul>' + equipoFilas + '</ul>' +
        '<div class="firmas"><div>Profesional Educación Diferencial</div><div>Coordinación PIE</div></div>' +
        '</body></html>';
    }

    function nombreArchivo() {
      const raw = ($('in-nombre').value || 'Estudiante').replace(/[\\/:*?"<>|]/g, '').trim() || 'Estudiante';
      return 'PAI_' + raw;
    }

    // ====== Descargar PDF (server-side) con fallback a window.print() ======
    async function descargarPDF() {
      const filename = nombreArchivo();
      try {
        const resp = await fetch('/api/generate-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ html: construirHtmlImpresion(), filename: filename })
        });
        if (!resp.ok) {
          let err = '';
          try { const ej = await resp.json(); err = ej.error || ''; } catch (e) {}
          throw new Error('Servidor respondió ' + resp.status + (err ? ': ' + err : ''));
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename + '.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        if (confirm('No se pudo generar el PDF en el servidor (' + (e.message || e) + ').\n\nSe abrirá el diálogo de impresión. Elige "Guardar como PDF".\n\n¿Continuar?')) {
          imprimir();
        }
      }
    }

    // ====== Imprimir (ventana con el HTML del PAI) ======
    function imprimir() {
      const win = window.open('', '_blank');
      if (!win) { toast('Permite las ventanas emergentes para imprimir.', true); return; }
      win.document.write(construirHtmlImpresion());
      win.document.close();
      win.focus();
      setTimeout(() => { win.print(); }, 400);
    }

    // ====== Cargar datos existentes / prefill ======
    async function prefillEstudiante(studentId) {
      try {
        const res = await fetch('/api/students/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ _token: token, studentId: parseInt(studentId, 10), fullAccess: true })
        });
        const out = await res.json();
        if (out.ok && out.student) {
          state.studentId = studentId;
          $('in-nombre').value = out.student.name || '';
          $('in-rut').value = out.student.rut || '';
          $('in-diagnostico').value = out.student.diagnosis || '';
          $('in-curso').value = out.student.work_level || out.student.real_level || '';
        }
      } catch (e) {}
    }

    async function cargarDocumento(docId) {
      try {
        const res = await fetch('/api/documents/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ _token: token, documentId: parseInt(docId, 10) })
        });
        const out = await res.json();
        if (!out.ok || !out.document) { toast('No se pudo cargar el documento.', true); return; }
        // Este documento es un PACI, no un PAI: abrirlo en el editor correcto.
        if (out.document.plan_type && out.document.plan_type !== 'pai') {
          if (confirm('Este documento es un PACI, no un PAI. ¿Abrirlo en el editor de PACI?')) {
            window.location.href = '/app.html?doc=' + out.document.id;
            return;
          }
        }
        state.documentId = out.document.id;
        state.studentId = out.document.student_id;
        let parsed = {};
        try { parsed = JSON.parse(out.document.document_json || '{}'); } catch (e) {}
        const s = parsed.student || {};
        $('in-nombre').value = s.name || '';
        $('in-rut').value = s.rut || '';
        $('in-curso').value = s.curso || '';
        $('in-diagnostico').value = s.diagnosis || '';
        $('in-ano').value = s.anoEscolar || '2026';
        if (out.document.trimester) $('in-periodo').value = out.document.trimester;
        state.apoyos = [];
        (parsed.apoyos || []).forEach((a) => agregarApoyo(a));
        state.equipo = [];
        (parsed.team || []).forEach((m) => agregarMiembro(m));
        renderApoyos();
        renderEquipo();
      } catch (e) {
        toast('Error de red al cargar.', true);
      }
    }

    // ====== Init ======
    (async function init() {
      const cfg = await window.TENANT_CONFIG_READY;
      $('tenant-name').textContent = cfg.nombre || 'Establecimiento';
      syncThemeIcon();
      if (cfg.calendario && cfg.calendario.ano_actual) $('in-ano').value = cfg.calendario.ano_actual;

      // Roles de solo lectura: deshabilitar el boton Guardar (coherente con app.html).
      if (!CAN_CREATE) {
        const bg = $('btn-guardar');
        if (bg) { bg.disabled = true; bg.title = 'Tu rol solo permite lectura'; bg.style.opacity = '0.5'; bg.style.cursor = 'not-allowed'; }
      }

      const docId = params.get('doc');
      const studentId = params.get('student');
      if (docId) {
        await cargarDocumento(docId);
      } else {
        if (studentId) await prefillEstudiante(studentId);
        agregarApoyo();
      }
      renderApoyos();
      renderEquipo();

      // Acciones automaticas desde el dashboard (?action=pdf|print)
      const action = params.get('action');
      if (action === 'pdf') setTimeout(descargarPDF, 600);
      else if (action === 'print') setTimeout(imprimir, 600);
    })();
  </script>
</body>
</html>
